name: Bug report
description: Something in Noctis does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Came from the extension?** The environment card is already filled in
        below. Two things are missing: what you saw, and the report file the
        extension saved to your Downloads.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        I pressed Connect on a VLESS server and the popup stayed on "Connecting…".
        After about 15 seconds it said the helper was not responding.
    validations:
      required: true

  - type: input
    id: protocol
    attributes:
      label: Protocol, if the problem is with one server
      placeholder: vless + reality, shadowsocks-2022, trojan + ws …

  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > ### 📎 Attach the `noctis-report-*.json` file from your Downloads
        > The extension saved it when it opened this form. Drag it into the
        > field below: it carries the whole core and helper log, which the card
        > does not. Without the file a report shows the state Noctis was in,
        > but not what the core wrote.

  - type: textarea
    id: diagnostics
    attributes:
      label: Environment and where it broke
      description: >
        Filled in for you when you open this issue from the extension — the
        "Report a problem" button in an error toast, in the helper dialog, or
        under Settings → Advanced → Diagnostics. No need to retype it; attach
        the report file in this same field. Server addresses, keys,
        subscription links and visited sites are stripped from both the card
        and the file.
      placeholder: |
        > [!WARNING]
        > ### 📎 …attach the report file…
        …
        | Environment | |
        | --- | --- |
        | Extension | 1.3.0 · UI language ru |

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: Attached the `noctis-report-*.json` file from my Downloads
        - label: Re-ran the install command from the helper dialog, and it still happens
        - label: Read the card above and I am willing to post it publicly
